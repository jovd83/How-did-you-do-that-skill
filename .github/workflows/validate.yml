name: Validate Skill

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Validate AgentSkill
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill package
        run: python scripts/validate_skill.py .

      - name: Unit tests (synthetic Claude Code, Copilot and Codex logs)
        run: python -m unittest discover -s tests -v

      - name: Smoke-test extract, render and check (no logs gives a valid no-AI report)
        run: |
          python scripts/extract_session.py . --out /tmp/metrics.json
          python scripts/render_report.py /tmp/metrics.json --out /tmp/report.md
          python scripts/render_report.py --check /tmp/report.md
